name: Build

on:
  push:
    branches:
      - release
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11'

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm install --global pnpm@${{ env.PNPM_VERSION }}

      - name: Generated contracts are current
        run: |
          python3 -m tools.codegen.configuration_schema --check
          python3 -m tools.codegen.telemetry_catalog --check
          python3 -m tools.codegen.font_catalog --check
          python3 -m tools.codegen.led_font --check
          python3 -m tools.codegen.ui_strings --check

      - name: Debug hooks unchanged
        run: python3 tools/check_debug_isolation.py --check

      - name: Configurator typecheck and lint
        working-directory: configurator
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm run lint

  configurator:
    name: Configurator (${{ matrix.label }})
    needs: checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
            artifact: configurator-macos
            files: |
              configurator/dist/*.dmg
              configurator/dist/*.dmg.blockmap
          - os: windows-latest
            label: Windows
            artifact: configurator-windows
            files: |
              configurator/dist/*.exe
              configurator/dist/*.exe.blockmap
          - os: ubuntu-latest
            label: Linux
            artifact: configurator-linux
            files: |
              configurator/dist/*.AppImage
              configurator/dist/*.deb
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm install --global pnpm@${{ env.PNPM_VERSION }}

      - name: Serial port build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libudev-dev

      - name: Install
        working-directory: configurator
        run: pnpm install --frozen-lockfile

      - name: Package
        working-directory: configurator
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm run package

      - name: The package carries no debugger and no telemetry bridge
        shell: bash
        working-directory: configurator
        run: |
          asar=$(find dist -name app.asar | head -1)
          if [ -z "$asar" ]; then
            echo "No app.asar found under dist" >&2
            exit 1
          fi
          for marker in out-debug registerDebugHandlers 'Pitrig Debugger' electron-builder.debug; do
            if grep -qa "$marker" "$asar"; then
              echo "The production package contains debug code: $marker" >&2
              exit 1
            fi
          done
          while IFS= read -r marker; do
            if grep -qa "$marker" "$asar"; then
              echo "The production package contains the telemetry bridge: $marker" >&2
              exit 1
            fi
          done <<'MARKERS'
          telemetry-bridge:
          TelemetryBridgeService
          SimHub plugin
          Install the Pitrig plugin
          MARKERS
          echo "$asar carries no debug code and no telemetry bridge"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  firmware:
    name: Firmware (${{ matrix.board }})
    needs: checks
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.2
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: t-display-s3
            directory: t-display
            target: esp32s3
            defaults: sdkconfig.defaults;sdkconfig.defaults.t-display-s3
          - board: guition-4848s040
            directory: guition
            target: esp32s3
            defaults: sdkconfig.defaults;sdkconfig.defaults.guition-esp32-4848s040
          - board: jc1060p470c
            directory: jc1060p470c
            target: esp32p4
            defaults: sdkconfig.defaults;sdkconfig.defaults.guition-jc1060p470c
          - board: esp32s3-devkit
            directory: devkit
            target: esp32s3
            defaults: sdkconfig.defaults;sdkconfig.defaults.esp32s3-devkit
    steps:
      - uses: actions/checkout@v7

      - name: Trust the workspace
        run: git config --global --add safe.directory '*'

      - name: Build
        shell: bash
        working-directory: firmware
        run: |
          . "$IDF_PATH/export.sh"
          build="build-${{ matrix.directory }}"
          idf.py -B "$build" \
            -DIDF_TARGET=${{ matrix.target }} \
            -DSDKCONFIG=sdkconfig.generated.${{ matrix.directory }} \
            -DSDKCONFIG_DEFAULTS="${{ matrix.defaults }}" \
            reconfigure
          idf.py -B "$build" reconfigure
          idf.py -B "$build" build

      - name: Collect
        shell: bash
        run: |
          build="firmware/build-${{ matrix.directory }}"
          out="firmware-out/${{ matrix.board }}"
          mkdir -p "$out"
          cp "$build/pitrig.bin" "$out/pitrig-${{ matrix.board }}.bin"
          cp "$build/bootloader/bootloader.bin" "$out/"
          cp "$build/partition_table/partition-table.bin" "$out/"
          cp "$build/ota_data_initial.bin" "$out/"
          cp "$build/flasher_args.json" "$out/"
          cp "$build/pitrig.elf" "$out/"

      - uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.board }}
          path: firmware-out/${{ matrix.board }}/**
          if-no-files-found: error

  release:
    name: Draft release
    needs: [configurator, firmware]
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: downloads

      - name: Gather
        run: |
          mkdir -p release
          find downloads -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' \) \
            -exec cp {} release/ \;
          for board in downloads/firmware-*; do
            name=$(basename "$board")
            cp "$board"/pitrig-*.bin release/
            tar --create --gzip --directory downloads --file "release/$name.tar.gz" "$name"
          done
          ls -l release

      - name: Write the release notes
        run: |
          version=$(node -p "require('./configurator/package.json').version")
          firmware=$(cat firmware/version.txt)
          base="${{ github.server_url }}/${{ github.repository }}/releases/download/v$version"
          link() {
            if [ -f "release/$1" ]; then printf '[%s](%s/%s)' "$1" "$base" "$1"; else printf 'not built'; fi
          }
          {
            echo "## Configurator $version"
            echo
            echo "| Platform | Download |"
            echo "| --- | --- |"
            echo "| macOS, Apple silicon | $(link "Pitrig-$version-arm64.dmg") |"
            echo "| macOS, Intel | $(link "Pitrig-$version.dmg") |"
            echo "| Windows | $(link "Pitrig.Setup.$version.exe") |"
            echo "| Linux, AppImage | $(link "Pitrig-$version.AppImage") |"
            echo "| Linux, Debian and Ubuntu | $(link "pitrig_${version}_amd64.deb") |"
            echo
            echo "Nothing here is signed. On macOS run \`xattr -dr com.apple.quarantine /Applications/Pitrig.app\` once after installing."
            echo
            echo "## Firmware $firmware"
            echo
            echo "The easiest route is the [web flasher](https://www.pitrig.com/flash). A board already running Pitrig updates itself over the USB cable from the configurator's Firmware panel, which takes the \`.bin\`."
            echo
            echo "| Board | Update over serial | First flash by cable |"
            echo "| --- | --- | --- |"
            for entry in \
              "t-display-s3:LilyGO T-Display-S3" \
              "guition-4848s040:Guition ESP32-4848S040" \
              "jc1060p470c:Guition JC1060P470C" \
              "esp32s3-devkit:Espressif ESP32-S3-DevKitC-1"; do
              id="${entry%%:*}"
              label="${entry#*:}"
              echo "| $label | $(link "pitrig-$id.bin") | $(link "firmware-$id.tar.gz") |"
            done
            echo
            echo "Each archive also carries the bootloader, the partition table and the flasher arguments: a first flash by cable needs them, an update over serial does not. Flash the image that matches the board in front of you — each one carries a single board identity."
            echo
            echo "## Changes"
            echo
            awk -v v="$version" '$0 ~ "^## " v { found = 1; next } found && /^## / { exit } found' CHANGELOG.md \
              | sed '/./,$!d'
          } > notes.md
          cat notes.md

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./configurator/package.json').version")
          tag="v$version"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
            gh release edit "$tag" --notes-file notes.md
          else
            gh release create "$tag" release/* \
              --draft \
              --target "$GITHUB_SHA" \
              --title "Pitrig $tag" \
              --notes-file notes.md
          fi
