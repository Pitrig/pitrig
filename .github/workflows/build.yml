name: Build

on:
  push:
    branches:
      - release
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11'
  SIMHUB_VERSION: '9.13.2'
  SIMHUB_SHA256: '9eeba279cc48bde4aea87671f04b0cecfb2e8c05a7d8b6f5484d229c0ad39589'

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm install --global pnpm@${{ env.PNPM_VERSION }}

      - name: Generated contracts are current
        run: |
          python3 -m tools.codegen.configuration_schema --check
          python3 -m tools.codegen.telemetry_catalog --check
          python3 -m tools.codegen.font_catalog --check
          python3 -m tools.codegen.led_font --check
          python3 -m tools.codegen.ui_strings --check

      - name: Debug hooks unchanged
        run: python3 tools/check_debug_isolation.py --check

      - name: Configurator typecheck and lint
        working-directory: configurator
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm run lint

  simhub-plugin:
    name: SimHub plugin
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Install SimHub
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'simhub.zip'
          $url = "https://github.com/SHWotever/SimHub/releases/download/$env:SIMHUB_VERSION/SimHub.$env:SIMHUB_VERSION.zip"
          Invoke-WebRequest $url -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:SIMHUB_SHA256) { throw "SimHub $env:SIMHUB_VERSION does not match its pinned digest: $hash" }
          $setup = Join-Path $env:RUNNER_TEMP 'simhub-setup'
          Expand-Archive $zip -DestinationPath $setup
          $installer = Get-ChildItem $setup -Filter '*.exe' -Recurse | Select-Object -First 1
          Start-Process $installer.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/DIR=C:\simhub'
          $needed = 'GameReaderCommon.dll', 'SimHub.Plugins.dll', 'SimHub.Logging.dll', 'log4net.dll'
          $deadline = (Get-Date).AddMinutes(20)
          while (@($needed | Where-Object { -not (Test-Path (Join-Path 'C:\simhub' $_)) }).Count -gt 0) {
            if ((Get-Date) -gt $deadline) { throw 'SimHub did not finish installing in time' }
            Start-Sleep -Seconds 5
          }
          Start-Sleep -Seconds 15
          Get-ChildItem 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall', 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall' |
            ForEach-Object { Get-ItemProperty $_.PSPath } |
            Where-Object { $_.DisplayName -like 'SimHub*' } |
            Format-List PSChildName, DisplayName, DisplayVersion, InstallLocation

      - name: Build
        shell: pwsh
        run: |
          $version = node -p "require('./configurator/package.json').version"
          $output = Join-Path $env:RUNNER_TEMP 'simhub-plugin'
          dotnet build simhub/plugin/Pitrig.SimHub/Pitrig.SimHub.csproj -c Release "-p:SimHubPath=C:\simhub" "-p:Version=$version" -o $output
          New-Item -ItemType Directory -Force simhub-plugin | Out-Null
          Copy-Item (Join-Path $output 'Pitrig.SimHub.dll') simhub-plugin/

      - uses: actions/upload-artifact@v7
        with:
          name: simhub-plugin
          path: simhub-plugin/Pitrig.SimHub.dll
          if-no-files-found: error

  configurator:
    name: Configurator (${{ matrix.label }})
    needs: [checks, simhub-plugin]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
            artifact: configurator-macos
            files: |
              configurator/dist/*.dmg
              configurator/dist/*.dmg.blockmap
          - os: windows-latest
            label: Windows
            artifact: configurator-windows
            files: |
              configurator/dist/*.exe
              configurator/dist/*.exe.blockmap
          - os: ubuntu-latest
            label: Linux
            artifact: configurator-linux
            files: |
              configurator/dist/*.AppImage
              configurator/dist/*.deb
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm install --global pnpm@${{ env.PNPM_VERSION }}

      - name: Serial port build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libudev-dev

      - name: Install
        working-directory: configurator
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v8
        if: matrix.os == 'windows-latest'
        with:
          name: simhub-plugin
          path: configurator/simhub-plugin

      - name: Package
        working-directory: configurator
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm run package

      - name: The package carries no debugger
        shell: bash
        working-directory: configurator
        run: |
          asar=$(find dist -name app.asar | head -1)
          if [ -z "$asar" ]; then
            echo "No app.asar found under dist" >&2
            exit 1
          fi
          for marker in out-debug registerDebugHandlers 'Pitrig Debugger' electron-builder.debug; do
            if grep -qa "$marker" "$asar"; then
              echo "The production package contains debug code: $marker" >&2
              exit 1
            fi
          done
          echo "$asar carries no debug code"

      - name: The Windows package carries the SimHub plugin
        if: matrix.os == 'windows-latest'
        shell: bash
        working-directory: configurator
        run: test -f dist/win-unpacked/resources/simhub-plugin/Pitrig.SimHub.dll

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  firmware:
    name: Firmware (${{ matrix.board }})
    needs: checks
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.2
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: t-display-s3
            directory: t-display
            target: esp32s3
            defaults: sdkconfig.defaults;sdkconfig.defaults.t-display-s3
          - board: guition-4848s040
            directory: guition
            target: esp32s3
            defaults: sdkconfig.defaults;sdkconfig.defaults.guition-esp32-4848s040
          - board: jc1060p470c
            directory: jc1060p470c
            target: esp32p4
            defaults: sdkconfig.defaults;sdkconfig.defaults.guition-jc1060p470c
          - board: esp32s3-devkit
            directory: devkit
            target: esp32s3
            defaults: sdkconfig.defaults;sdkconfig.defaults.esp32s3-devkit
    steps:
      - uses: actions/checkout@v7

      - name: Trust the workspace
        run: git config --global --add safe.directory '*'

      - name: Build
        shell: bash
        working-directory: firmware
        run: |
          . "$IDF_PATH/export.sh"
          build="build-${{ matrix.directory }}"
          idf.py -B "$build" \
            -DIDF_TARGET=${{ matrix.target }} \
            -DSDKCONFIG=sdkconfig.generated.${{ matrix.directory }} \
            -DSDKCONFIG_DEFAULTS="${{ matrix.defaults }}" \
            reconfigure
          idf.py -B "$build" reconfigure
          idf.py -B "$build" build

      - name: Collect
        shell: bash
        run: |
          build="firmware/build-${{ matrix.directory }}"
          out="firmware-out/${{ matrix.board }}"
          mkdir -p "$out"
          cp "$build/pitrig.bin" "$out/pitrig-${{ matrix.board }}.bin"
          cp "$build/bootloader/bootloader.bin" "$out/"
          cp "$build/partition_table/partition-table.bin" "$out/"
          cp "$build/ota_data_initial.bin" "$out/"
          cp "$build/flasher_args.json" "$out/"
          cp "$build/pitrig.elf" "$out/"

      - uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.board }}
          path: firmware-out/${{ matrix.board }}/**
          if-no-files-found: error

  release:
    name: Draft release
    needs: [configurator, firmware]
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: downloads

      - name: Gather
        run: |
          mkdir -p release
          find downloads -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name 'Pitrig.SimHub.dll' \) \
            -exec cp {} release/ \;
          for board in downloads/firmware-*; do
            name=$(basename "$board")
            cp "$board"/pitrig-*.bin release/
            tar --create --gzip --directory downloads --file "release/$name.tar.gz" "$name"
          done
          ls -l release

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./configurator/package.json').version")
          firmware=$(cat firmware/version.txt)
          tag="v$version"
          python3 tools/release_notes.py release \
            --version "$version" \
            --firmware "$firmware" \
            --tag "$tag" \
            --repo "$GITHUB_REPOSITORY" > notes.md
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
            gh release edit "$tag" --notes-file notes.md
          else
            gh release create "$tag" release/* \
              --draft \
              --target "$GITHUB_SHA" \
              --title "Pitrig $tag" \
              --notes-file notes.md
          fi
