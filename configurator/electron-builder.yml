appId: dev.pitrig.configurator
productName: Pitrig
directories:
  output: dist
files:
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - resources/**
  - package.json
asarUnpack:
  - '**/*.node'
mac:
  icon: resources/icon.png
  category: public.app-category.developer-tools
  identity: null
  target:
    - dmg
win:
  icon: resources/icon.png
  target:
    - nsis
linux:
  icon: resources/icon.png
  category: Development
  maintainer: Illia Lukashchuk <contact.pitrig@gmail.com>
  executableName: pitrig
  syncDesktopName: true
  target:
    - AppImage
    - deb

deb:
  packageName: pitrig
  artifactName: pitrig_${version}_${arch}.${ext}
