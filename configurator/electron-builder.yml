appId: dev.pitrig.configurator
productName: Pitrig
directories:
  output: dist
files:
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - resources/**
  - package.json
asarUnpack:
  - '**/*.node'
mac:
  icon: resources/icon.png
  category: public.app-category.developer-tools
  identity: null
  target:
    - target: dmg
      arch:
        - arm64
        - x64
win:
  icon: resources/icon.png
  target:
    - nsis
  extraResources:
    - from: simhub-plugin
      to: simhub-plugin
      filter:
        - Pitrig.SimHub.dll
linux:
  icon: resources/icon.png
  category: Development
  maintainer: Illia Lukashchuk <contact.pitrig@gmail.com>
  executableName: pitrig
  syncDesktopName: true
  target:
    - AppImage
    - deb

nsis:
  artifactName: Pitrig-Setup-${version}.${ext}
  include: installer/simhub-plugin.nsh

deb:
  packageName: pitrig
  artifactName: pitrig_${version}_${arch}.${ext}
