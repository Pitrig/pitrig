appId: dev.simcore.configurator
productName: SimCore
directories:
  output: dist
files:
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - resources/**
  - package.json
asarUnpack:
  - '**/*.node'
mac:
  icon: resources/icon.png
  category: public.app-category.developer-tools
  identity: null
  target:
    - dmg
win:
  icon: resources/icon.png
  target:
    - nsis
linux:
  icon: resources/icon.png
  category: Development
  maintainer: SimCore <simcoreproject@users.noreply.github.com>
  executableName: simcore
  syncDesktopName: true
  target:
    - AppImage
    - deb

deb:
  packageName: simcore
  artifactName: simcore_${version}_${arch}.${ext}
